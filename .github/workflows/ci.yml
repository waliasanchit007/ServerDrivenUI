name: CI

# Caliclan CI build gate per docs/KONDUIT_PLAN.md §7.5 / §8.5.
#
# What it covers (all on macOS so iOS framework link is real):
#   1. Android   — :androidApp:assembleDebug
#   2. iOS sim   — :composeApp:linkDebugFrameworkIosSimulatorArm64
#   3. Guest     — :presenter:compileDevelopmentExecutableKotlinJsZipline
#
# Repository secret required:
#   KONDUIT_READ_TOKEN — a CLASSIC GitHub PAT with `read:packages` scope.
#   IMPORTANT: a fine-grained PAT does NOT work — GitHub Packages' Maven
#   registry only honors classic tokens; a fine-grained one returns 404
#   (not 401) so the symptom looks like a missing artifact, not auth.
#   Set the secret under Settings → Secrets and variables → Actions. The
#   default GITHUB_TOKEN cannot read packages from a different repository
#   in the same account, so this is mandatory. See docs/CI_SETUP.md.

on:
  push:
    branches: [main, "konduit-main", "claude/**"]
  pull_request:

# Run a single job per ref; cancel older runs in the same PR / branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS — Android + iOS + guest
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Standard maven-pkg auth — see settings.gradle.kts. Both env names
      # are required because the resolver checks `gpr.user`/`gpr.token`
      # gradle props first then falls back to GITHUB_ACTOR/GITHUB_TOKEN.
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.KONDUIT_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache + share configuration cache and dependencies across runs
          # but never write the cache from a non-default branch — keeps
          # main's cache clean.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/konduit-main' }}

      # Konduit token sanity check — fail fast with a clear message
      # rather than letting Gradle hit a 401 and produce a noisy error.
      # We probe two things and surface BOTH so a 404 has a clear cause:
      #   1. /user — succeeds for ANY classic PAT regardless of scopes.
      #      Response includes X-OAuth-Scopes header listing the token's
      #      effective scopes (fine-grained PATs return EMPTY, classic
      #      PATs list scopes like "read:packages, repo, ..."). This is
      #      the gold-standard "what is this token actually capable of"
      #      check.
      #   2. The Maven artifact pom — same as before; 404 here AFTER /user
      #      succeeds means scopes are wrong (or repo access missing).
      - name: Verify Konduit read token is present + can read packages
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error ::KONDUIT_READ_TOKEN secret is missing — see .github/workflows/ci.yml header for setup"
            exit 1
          fi

          echo "=== Token diagnostic via /user ==="
          # -i prints headers; we grep the OAuth headers + the HTTP status
          # line. A fine-grained PAT will show empty X-OAuth-Scopes.
          curl -s -i -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            "https://api.github.com/user" \
            | awk 'BEGIN{IGNORECASE=1} /^HTTP\/|^x-oauth-scopes|^x-accepted-oauth-scopes|^x-github-token-type/{print}' \
            || true

          echo ""
          echo "=== Konduit Maven artifact probe ==="
          probe="https://maven.pkg.github.com/waliasanchit007/konduit/dev/konduit/konduit-gradle-plugin/1.0.0-caliclan.2/konduit-gradle-plugin-1.0.0-caliclan.2.pom"
          status=$(curl -s -o /dev/null -w "%{http_code}" -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$probe")
          echo "Probe $probe → HTTP $status"
          if [ "$status" != "200" ]; then
            cat <<'EOF' >&2
::error ::Konduit Maven probe failed. Check the X-OAuth-Scopes line above:
::error ::  - Empty / no header → fine-grained PAT (cannot read GH Packages Maven). Regenerate as classic.
::error ::  - Present but missing 'read:packages' → add the scope to the PAT.
::error ::  - Includes 'read:packages' → token is fine; the artifact may have been deleted or the user lacks access to the konduit repo.
EOF
            exit 1
          fi

      # Android: assembleDebug. Compiles the host APK including the
      # composeApp KMP library + protocol-host KLib. This is the same
      # task we run locally before adb install.
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # iOS: link the debug framework for iPhone simulator (Apple silicon).
      # We don't actually launch a sim in CI — the link step is what
      # would catch a Kotlin/Native compile or interop break. Real
      # device verification stays manual until we add a UI test loop.
      - name: Link iOS simulator framework (arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Guest: compile the .zipline file the dev-server serves. This
      # validates the protocol-guest codegen + Kotlin/JS compile.
      - name: Compile guest .zipline (development)
        run: ./gradlew :presenter:compileDevelopmentExecutableKotlinJsZipline --stacktrace

      # Optional: also assemble the iOS .app via xcodebuild. Skipped by
      # default because it adds ~2 minutes and the framework link above
      # is what would actually catch a regression. Enable later if we
      # see ObjC binding issues slip through.
      # - name: Build iOS .app
      #   run: |
      #     xcodebuild \
      #       -project iosApp/iosApp.xcodeproj \
      #       -scheme iosApp \
      #       -configuration Debug \
      #       -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
      #       build
